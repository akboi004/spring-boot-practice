#MYSQL DB Configuration
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/practice_db
spring.datasource.username=root
spring.datasource.password=mysql@root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.format-sql=true
spring.jpa.hibernate.ddl-auto=update

#HikariCP Connection Configuration
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.connection-timeout=50000 
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=3 
spring.datasource.hikari.pool-name=HikariPoolName
spring.datasource.hikari.connection-test-query=SELECT 1
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=TRACE



spring.messages.basename=messages, config.i18n.messages

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

#Caching
spring.cache.jcache.config=classpath:ehcache.xml

#SSL
#server.port=8443
#server.ssl.key-store=classpath:ssl-server.jks
#server.ssl.key-store-password=changeit
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=selfsigned_localhost_sslserver
#server.ssl.enabled=true

#Actuators
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/manage
management.server.port=8081

#Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.example.demo.controller=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - [%thread] %-5level %logger{36} - %msg%n
logging.file.max-size=10MB
logging.file.max-history=30
logging.level.org.springframework.boot.actuate=INFO


