<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flames Calculator</title>
	<style>
	        body {
	            font-family: sans-serif;
	            display: flex;
	            flex-direction: column;
	            align-items: center;
	            justify-content: center;
	            min-height: 100vh;
	            margin: 0;
	            background-color: #f0f0f0; /* Light gray background */
	        }

	        .container {
	            background-color: white;
	            padding: 30px;
	            border-radius: 8px;
	            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
	            text-align: center;
	            width: 400px; /* Set a fixed width */
	        }

	        h1 {
	            color: #333; /* Dark gray heading */
	            margin-bottom: 20px;
	        }

	        label {
	            display: block;
	            margin-bottom: 5px;
	            font-weight: bold;
	        }

	        input[type="text"] {
	            width: calc(100% - 12px); /* Account for padding */
	            padding: 8px;
	            margin-bottom: 15px;
	            border: 1px solid #ccc;
	            border-radius: 4px;
	            box-sizing: border-box;
	        }

	        button {
	            background-color: #007bff; /* Blue button */
	            color: white;
	            padding: 10px 20px;
	            border: none;
	            border-radius: 4px;
	            cursor: pointer;
	            transition: background-color 0.3s ease;
	        }

	        button:hover {
	            background-color: #0056b3; /* Darker blue on hover */
	        }

	        #result {
	            margin-top: 20px;
	            font-size: 1.2em;
	            font-weight: bold;
	        }
	        .error {
	            color: red;
	            margin-top: 10px;
	        }
	    </style>
</head>
<body>
    <div class="container">
        <h1>Flames Calculator</h1>
        <form action="/calculate" method="post">
            <label for="name1">Name 1:</label>
            <input type="text" id="name1" name="name1" th:value="${name1}"><br>

            <label for="name2">Name 2:</label>
            <input type="text" id="name2" name="name2" th:value="${name2}"><br>

            <button type="submit">Calculate Flames</button>
            <div th:if="${error}" class="error" th:text="${error}"></div>
        </form>
    </div>
</body>
</html>
